
name: Gerar Linux Video Maker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2

      - name: Dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libvulkan-dev libfontconfig1-dev libfreetype6-dev zsync curl

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Instalar nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Criar AppImage DEB RPM e TAR.GZ
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash packaging/linux/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: video-maker-linux-x64
          path: |
            dist/release/video-maker-*-linux-x86_64.*
          if-no-files-found: error
