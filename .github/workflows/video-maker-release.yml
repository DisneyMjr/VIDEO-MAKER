name: Publicar Video Maker
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao EXATA do Cargo.toml, por exemplo 0.8.0'
        required: true
        type: string
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar versao
        id: check
        env:
          REQUESTED: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          v=$(awk '/^\[workspace.package\]/{found=1;next} found && /^\[/{exit} found && /^version *=/{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)
          test "$v" = "$REQUESTED" || { echo "Cargo.toml: $v / solicitado: $REQUESTED"; exit 1; }
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use versao numerica x.y.z'; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append $env:GITHUB_PATH
      - name: Gerar MSI e portatil
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/video-maker-*-windows-x64*
          if-no-files-found: error
  linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libvulkan-dev libfontconfig1-dev libfreetype6-dev zsync curl
      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Instalar nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Gerar Linux
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/release/video-maker-*-linux-x86_64.*
          if-no-files-found: error
  publish:
    needs: [validate, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      - name: SHA256
        working-directory: release-files
        run: sha256sum video-maker-* > SHA256SUMS.txt
      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag ja existe. Incrementar versao para evitar sobrescrever." >&2
            exit 1
          fi
          gh release create "$tag" release-files/* --target "$GITHUB_SHA" --title "Video Maker $tag" --generate-notes
